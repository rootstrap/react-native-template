# 🔗 Links:
# Source file: https://github.com/rootstrap/react-native-template/blob/master/.github/workflows/e2e-android-eas-build.yml
# End-to-end testing: https://rootstrap.github.io/react-native-template/testing/end-to-end-testing/

# ✍️ Description:
# This workflow is used to run end-to-end tests for EAS build on Android.
# It runs the tests with Maestro on an Android emulator in GitHub Actions.
# It downloads the APK from the provided EAS build URL and runs the tests against the downloaded APK.

# 🚨 GITHUB SECRETS REQUIRED: None

name: E2E Tests EAS Build Android (Maestro + Github Action)

on:
  workflow_dispatch:
    inputs:
      apk-url:
        type: string
        description: EAS APK URL (https://expo.dev/artifacts/eas/...)
        required: true
        default: ''

jobs:
  download-eas-apk:
    if: github.event.inputs.apk-url != ''
    name: Download Test APK From EAS Url (curl)
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Download EAS APK
        env:
          # Passed through an env var, never interpolated into the script, so the input cannot inject shell commands.
          APK_URL: ${{ github.event.inputs.apk-url }}
        # Only EAS build artifact links (https://expo.dev/artifacts/eas/<id>.apk) are accepted as input. EAS redirects
        # them to its storage host, so redirects are followed but must stay on https.
        run: |
          if [[ ! "$APK_URL" =~ ^https://expo\.dev/artifacts/eas/[A-Za-z0-9_-]+\.apk$ ]]; then
            echo "apk-url must be an EAS artifact URL (https://expo.dev/artifacts/eas/<id>.apk)" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 5 \
            --output ./app-release.apk "$APK_URL"

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: ./app-release.apk

  test-android:
    name: E2E Tests EAS Build Android (Maestro + Github Action)
    needs: download-eas-apk
    runs-on: ubuntu-latest
    # The emulator setup below matches the test-android job in e2e-android.yml: keep both in sync.
    env:
      # Shared by the AVD cache key and both emulator steps so a cached AVD always matches the requested one.
      EMULATOR_API_LEVEL: 29
      EMULATOR_ARCH: x86_64

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Install Maestro
        run: npm run install-maestro # # We use npm because we don't need to install deps again

      - name: Download Test APK
        uses: actions/download-artifact@v4
        with:
          name: test-apk
          path: ${{ github.workspace }}

      - name: 📦 Read app id from the test APK
        uses: ./.github/actions/read-apk-app-id
        with:
          apk-path: ${{ github.workspace }}/app-release.apk

      - name: Gradle cache
        uses: gradle/gradle-build-action@v2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-${{ env.EMULATOR_API_LEVEL }}-${{ env.EMULATOR_ARCH }}

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          cores: 2
          ram-size: 4096M
          profile: Nexus 6
          script: echo "Generated AVD snapshot for caching."

      - name: Run tests with Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          cores: 2
          ram-size: 4096M
          profile: Nexus 6
          script: |
            adb install "${{ github.workspace }}/app-release.apk"
            $HOME/.maestro/bin/maestro test .maestro/ --env=APP_ID="$APP_ID" --format junit

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: ~/.maestro/tests/**/*

      - name: Store tests result
        uses: actions/upload-artifact@v4
        with:
          name: e2e_android_report
          path: |
            report.xml
