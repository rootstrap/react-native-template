# 🔗 Links:
# Source file: https://github.com/rootstrap/react-native-template/blob/master/.github/workflows/expo-doctor.yml

# ✍️ Description:
# This workflow runs the expo doctor command to check if your project dependencies are aligned with the expo sdk version you are using.
# Can be triggered manually from the Actions tab in your project, and also runs once a week on a schedule.
# Runs Also on pull requests and pushes to the main/master branch, but only if the `package.json` or `pnpm-lock.yaml` files have been changed.
# When expo doctor fails outside of a pull request (push, schedule or manual run), a second job runs `expo install --fix`
# on the default branch and opens (or updates) a pull request with the aligned dependencies, so they can be reviewed and merged.
# Note: pull requests opened with the default GITHUB_TOKEN do not trigger other workflows; close and reopen the pull request to run the checks.
# Note: "Allow GitHub Actions to create and approve pull requests" must be enabled in the repository settings (Settings > Actions > General).

# 🚨 GITHUB SECRETS REQUIRED: NONE

name: Expo Doctor (expo)

on:
  push:
    branches:
      - main
      - master
    paths:
      - package.json
      - pnpm-lock.yaml
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  doctor:
    name: Expo Doctor (expo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🚑 Run Doctor Checks
        run: |
          chmod +x .github/scripts/expo-doctor.sh
          .github/scripts/expo-doctor.sh

      - name: Add doctor report as comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: expo-doctor
          path: .expo/expo-doctor.md

  fix-dependencies:
    name: Fix Expo dependencies (expo)
    needs: doctor
    if: always() && needs.doctor.result == 'failure' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📦 Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🔧 Align dependencies with the Expo SDK
        run: pnpm expo install --fix

      - name: 🔀 Create or update Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/expo-doctor-fix-dependencies
          delete-branch: true
          add-paths: |
            package.json
            pnpm-lock.yaml
          commit-message: 'chore: align dependencies with the expo sdk'
          title: 'chore: align dependencies with the expo sdk'
          body: |
            ## What does this do?

            Runs `pnpm expo install --fix` on the default branch to update the dependencies that Expo Doctor reported as not aligned with the installed Expo SDK version.

            ## Why did you do this?

            The [Expo Doctor workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed, and this pull request was created automatically by it.

            ## How to review

            - Review the version changes in `package.json` and `pnpm-lock.yaml`.
            - Checks are not triggered automatically for pull requests created by GitHub Actions: close and reopen this pull request to run them.
            - Expo Doctor may also report issues that `expo install --fix` cannot solve; check the workflow logs and fix those manually.
