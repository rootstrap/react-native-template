# 🔗 Links:
# Source file: https://github.com/rootstrap/react-native-template/blob/master/.github/workflows/deploy-cli.yml

# ✍️ Description:
# This workflow is used to create a new version of the CLI and publish it to the npm registry.
# As this workflow will push code to the repo, we set up GitHub Bot as a Git user.
# This Workflow need to be triggered manually from the Actions tab in the repo.
#         1. Choose your release type (patch, minor, major)
#         2. The workflow runs the following steps (only from the master branch):
#             - Bump the version in package.json based on the release type
#             - Commit the bump, tag it as cli-v<version> and push both to the repo
#             - Publish the CLI to the npm registry (only after the push succeeded)
#
#         Recovery: if the publish step fails after the push, delete the remote cli-v<version> tag
#         and publish manually from cli/ (or re-run, which will bump to the next version).
#         A publish failing with ENEEDAUTH/404 usually means the Trusted Publisher config on npmjs.com
#         does not match this workflow (filename, environment, org/repo).
#

# 🚨 NPM PUBLISHING (Trusted Publishing, no NPM_TOKEN needed):
#         The CLI is published through npm Trusted Publishing (OIDC): npm exchanges the GitHub
#         Actions identity of this job for a short-lived publish token, so no long-lived secret is stored.
#         Docs: https://docs.npmjs.com/trusted-publishers
#         One-time setup on npmjs.com > create-rootstrap-rn-app > Settings > Trusted Publisher > GitHub Actions:
#             - Organization or user: rootstrap
#             - Repository: react-native-template
#             - Workflow filename: deploy-cli.yml
#             - Environment name: CLI
#             - Allowed actions: npm publish
#         All fields are case-sensitive and must match exactly. Requirements: npm >= 11.5.1, a GitHub-hosted runner,
#         `id-token: write` permission on the job and `repository.url` in cli/package.json matching this repo.
#
# 🚨 GITHUB SECRETS REQUIRED:
#         - NEW_TEMPLATE_VERSION_PAT: A fine-grained Personal Access Token with Contents: Read & write.
#           It is shared with the New Template Version workflow, see new-template-version.yml for setup instructions.
#           It is needed (instead of GITHUB_TOKEN) to push the release commit to the protected default branch.

name: Deploy CLI to NPM Registry

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: 'Release type (one of): patch, minor, major'
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    # Serialize CLI releases without cancelling a run that is already publishing.
    concurrency:
      group: deploy-cli
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: CLI
      url: https://www.npmjs.com/package/create-rootstrap-rn-app/v/${{ env.NEW_VERSION }}
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC)
      id-token: write
    env:
      HUSKY: 0
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          # Check out the current master tip once the run holds the concurrency slot,
          # so a queued run bumps from the version the previous run pushed.
          ref: master
          fetch-depth: 0
          token: ${{ secrets.NEW_TEMPLATE_VERSION_PAT }}
      - name: 📝 Git User Setup
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: 📦 Setup Node + PNPM
        uses: ./.github/actions/setup-node-pnpm-install
      # Trusted Publishing needs npm >= 11.5.1, but the Node version in .nvmrc ships npm 10.x.
      # Done before the push so a failure here cannot leave a release commit/tag without a publish.
      - name: 📦 Update npm (Trusted Publishing requires >= 11.5.1)
        run: |
          npm install -g npm@11.5.1
          npm --version
      # Fail before pushing anything if the job cannot request an OIDC token (missing `id-token: write`).
      # The Trusted Publisher config on npmjs.com can only be validated by the publish itself, see header.
      - name: 🔍 Check OIDC token availability
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::OIDC token unavailable. The job needs 'permissions: id-token: write' for npm Trusted Publishing."
            exit 1
          fi
      - name: 📦 Install CLI Dependencies
        run: |
          cd cli
          pnpm install --frozen-lockfile
      - name: 📦 Bump release version
        run: |
          cd cli
          echo "NEW_VERSION=$(npm --no-git-tag-version --tag-version-prefix= version $RELEASE_TYPE)" >> $GITHUB_ENV
          echo "RELEASE_TAG=latest" >> $GITHUB_ENV
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release-type }}
      - name: Commit package.json changes
        run: |
          git add "cli/package.json"
          git commit -m "build(cli): release CLI v${{ env.NEW_VERSION }}"
      # Push before publishing: if the push is rejected (e.g. expired PAT, missing bypass),
      # nothing has been published to npm yet, so the repo and the registry stay in sync.
      # The tag is prefixed with "cli-" to avoid clashing with the template's v* tags.
      - name: 🔗 Tag and push changes to repository
        run: |
          git tag "cli-v${{ env.NEW_VERSION }}"
          git push --atomic origin HEAD:master "cli-v${{ env.NEW_VERSION }}"
      # Use npm (not pnpm) to publish: it performs the OIDC token exchange, so no auth token is configured.
      - name: 📦 Publish to NPM registry
        run: |
          cd cli
          npm publish --verbose --tag ${{ env.RELEASE_TAG }}
